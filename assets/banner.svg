<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: dashMove 12s linear infinite;
    }
    .pulse-glow-1 {
      animation: pulseAnim1 6s ease-in-out infinite alternate;
    }
    .pulse-glow-2 {
      animation: pulseAnim2 8s ease-in-out infinite alternate;
    }
    .node-float-1 {
      animation: floatNode1 7s ease-in-out infinite alternate;
    }
    .node-float-2 {
      animation: floatNode2 6s ease-in-out infinite alternate;
    }
    .node-float-3 {
      animation: floatNode3 8s ease-in-out infinite alternate;
    }
    .node-float-4 {
      animation: floatNode4 9s ease-in-out infinite alternate;
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulseAnim1 {
      0% { opacity: 0.35; transform: scale(0.95); }
      100% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes pulseAnim2 {
      0% { opacity: 0.3; transform: scale(1.05); }
      100% { opacity: 0.65; transform: scale(0.92); }
    }
    @keyframes floatNode1 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes floatNode2 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(7px); }
    }
    @keyframes floatNode3 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }
    @keyframes floatNode4 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(8px); }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Tech Grid Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Animated Ambient Glow Blobs in Background -->
  <g filter="url(#glow)">
    <circle class="pulse-glow-1" cx="200" cy="90" r="130" fill="#38bdf8" opacity="0.22" />
    <circle class="pulse-glow-2" cx="1020" cy="180" r="160" fill="#818cf8" opacity="0.25" />
    <circle class="pulse-glow-1" cx="720" cy="300" r="110" fill="#c084fc" opacity="0.18" />
  </g>

  <!-- Animated Dynamic Connecting Streams in Background Right -->
  <g opacity="0.45">
    <path class="flow-line" d="M 720 100 C 850 80, 890 190, 1060 140" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path class="flow-line" d="M 740 240 C 860 270, 930 150, 1070 230" fill="none" stroke="#818cf8" stroke-width="2" />
    <path class="flow-line" d="M 690 170 C 800 200, 920 80, 1040 90" fill="none" stroke="#c084fc" stroke-width="1.8" />
  </g>

  <!-- Dynamic Interactive Floating Component Badges (Right Canvas Side) -->
  <g class="node-float-1">
    <g transform="translate(740, 60)">
      <rect width="180" height="42" rx="21" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="21" cy="21" r="7" fill="#38bdf8" />
      <text x="38" y="26" class="pill-text">🎨 3D Configurators</text>
    </g>
  </g>

  <g class="node-float-2">
    <g transform="translate(945, 115)">
      <rect width="185" height="42" rx="21" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="21" cy="21" r="7" fill="#818cf8" />
      <text x="38" y="26" class="pill-text">⚡ Dynamic Options</text>
    </g>
  </g>

  <g class="node-float-3">
    <g transform="translate(730, 215)">
      <rect width="195" height="42" rx="21" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="21" cy="21" r="7" fill="#c084fc" />
      <text x="38" y="26" class="pill-text">🛍️ Line-Item Fields</text>
    </g>
  </g>

  <g class="node-float-4">
    <g transform="translate(930, 245)">
      <rect width="180" height="42" rx="21" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="21" cy="21" r="7" fill="#34d399" />
      <text x="38" y="26" class="pill-text">💎 Visual CPQ Tools</text>
    </g>
  </g>

  <!-- Foreground Title and Branding (Crisp & High Contrast) -->
  <g transform="translate(75, 55)">
    <!-- Category Pill Tag -->
    <rect width="210" height="30" rx="15" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="15" cy="15" r="4.5" fill="#38bdf8" />
    <text x="28" y="20" class="badge-text">ECOMMERCE ARCHITECTURE</text>

    <!-- Main Title -->
    <text x="0" y="85" class="title-text">
      Awesome Product
    </text>
    <text x="0" y="135" class="title-text" fill="url(#accentGrad)" style="fill: url(#accentGrad);">
      Customization
    </text>

    <!-- Subtitle -->
    <text x="0" y="178" class="subtitle-text">
      Curated Ecosystem of SaaS Options, 3D Configurators &amp; Open-Source Tools
    </text>

    <!-- Framework Supported Tags -->
    <g transform="translate(0, 215)">
      <rect width="84" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="12" y="17" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Shopify</text>

      <rect x="94" width="118" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="106" y="17" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">WooCommerce</text>

      <rect x="222" width="80" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="234" y="17" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Three.js</text>

      <rect x="312" width="82" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="324" y="17" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Odoo ERP</text>

      <rect x="404" width="76" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
      <text x="416" y="17" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Headless</text>
    </g>
  </g>

  <!-- Border Frame Accent Line -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3" />
</svg>
